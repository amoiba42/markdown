# AutoSE: issue in, reviewed pull request out. Design: architecture/decisions/ADR-001..012.
# Never merges. Event fields reach scripts only through env (ADR-006).
name: autose

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string

permissions: {}

# One run per issue (ADR-005). Events that will not start the orchestrator (other labels, ordinary or
# unauthorised comments) get their own throwaway group, so they can never replace a queued re-entry run.
concurrency:
  group: >-
    autose-${{ github.event.issue.number || inputs.issue }}${{
      ((github.event_name == 'issues' && github.event.label.name != 'autose') ||
       (github.event_name == 'issue_comment' && (github.event.issue.pull_request ||
         !startsWith(github.event.comment.body, '/autose') ||
         !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
         github.event.comment.user.type == 'Bot')))
      && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: false

env:
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
  AUTOSE_TOOL: tool/.github/autose
  AUTOSE_VARIANT: ${{ vars.AUTOSE_VARIANT || 'A' }}
  AUTOSE_RETRIES: ${{ vars.AUTOSE_RETRIES || '2' }}
  AUTOSE_BASE_REF: master
  PYTHON_VERSION: "3.12"

jobs:
  orchestrator:
    # ADR-005: label `autose`, or `/autose` on an issue (not a PR) by OWNER/MEMBER/COLLABORATOR and not a Bot,
    # or a workflow_dispatch re-entry.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'autose') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/autose') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.comment.user.type != 'Bot') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write      # issue mirror and assumptions comment
      actions: read      # download state from earlier runs (ADR-004)
    outputs:
      status: ${{ steps.orch.outputs.status }}
    steps:
      - name: Checkout tooling (trusted, master)
        uses: actions/checkout@v4
        with: { ref: "${{ env.AUTOSE_BASE_REF }}", path: tool, persist-credentials: false }
      - name: Checkout fork for agents (base commit)
        uses: actions/checkout@v4
        with: { ref: "${{ env.AUTOSE_BASE_REF }}", path: work, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install tooling
        run: pip install -q -r "$AUTOSE_TOOL/requirements.txt"
      - name: Orchestrator (Stages 1-4)
        id: orch
        working-directory: ${{ env.AUTOSE_TOOL }}
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOSE_CHECKOUT: ${{ github.workspace }}/work
          MSWEA_COST_TRACKING: ignore_errors
        run: python orchestrator.py
      - name: Upload state bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-issue-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/autose/art
          include-hidden-files: true
          overwrite: true
      - name: Upload review input (issue snapshot + baseline only)
        if: steps.orch.outputs.status == 'ready'
        uses: actions/upload-artifact@v4
        with:
          name: autose-review-input-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/autose/review_input
          overwrite: true

  release:
    needs: orchestrator
    if: needs.orchestrator.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read       # G5: poll CI on the pushed commit
      pull-requests: read
    outputs:
      status: ${{ steps.rel.outputs.status }}
      pr: ${{ steps.rel.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.AUTOSE_BASE_REF }}", path: tool, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.AUTOSE_BASE_REF }}", path: work, persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Download state bundle
        uses: actions/download-artifact@v4
        with:
          name: autose-issue-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/autose/art
      - name: Release (Stage 5)
        id: rel
        working-directory: ${{ env.AUTOSE_TOOL }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOSE_PAT: ${{ secrets.AUTOSE_PAT }}
          AUTOSE_CHECKOUT: ${{ github.workspace }}/work
        run: python release.py
      - name: Upload release outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-release-${{ env.ISSUE_NUMBER }}
          path: |
            ${{ runner.temp }}/autose/art/pr.md
            ${{ runner.temp }}/autose/art/release.json
            ${{ runner.temp }}/autose/art/release_state.json
            ${{ runner.temp }}/autose/art/explanation.md
          if-no-files-found: ignore
          overwrite: true

  review:
    needs: [orchestrator, release]
    if: needs.release.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:          # ADR-002: no actions: read
      contents: read
      pull-requests: write
    outputs:
      status: ${{ steps.rev.outputs.status }}
      verdict: ${{ steps.rev.outputs.verdict }}
    steps:
      - name: Checkout tooling (trusted, master)
        uses: actions/checkout@v4
        with: { ref: "${{ env.AUTOSE_BASE_REF }}", path: tool, persist-credentials: false }
      - name: Checkout PR head
        uses: actions/checkout@v4
        with: { path: pr, ref: "autose/issue-${{ env.ISSUE_NUMBER }}", persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -q -r "$AUTOSE_TOOL/requirements.txt"
      - name: Download review input only
        uses: actions/download-artifact@v4
        with:
          name: autose-review-input-${{ env.ISSUE_NUMBER }}
          path: review_input
      - name: Review (Stage 6)
        id: rev
        working-directory: ${{ env.AUTOSE_TOOL }}
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ needs.release.outputs.pr }}
          AUTOSE_BASE_SHA: ${{ github.sha }}
          AUTOSE_PR_CHECKOUT: ${{ github.workspace }}/pr
          AUTOSE_REVIEW_INPUT: ${{ github.workspace }}/review_input
          MSWEA_COST_TRACKING: ignore_errors
        run: python review.py
      - name: Upload review outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-review-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/autose/art
          if-no-files-found: ignore
          overwrite: true

  route:
    needs: [orchestrator, release, review]
    if: always() && needs.orchestrator.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write     # workflow_dispatch re-entry (ADR-003)
      issues: write      # stop comment and issue mirror (ADR-006)
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.AUTOSE_BASE_REF }}", path: tool, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Download state bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: "autose-issue-${{ env.ISSUE_NUMBER }}", path: "${{ runner.temp }}/autose/art" }
      - name: Download release outputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: "autose-release-${{ env.ISSUE_NUMBER }}", path: "${{ runner.temp }}/autose/art/release" }
      - name: Download review outputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: "autose-review-${{ env.ISSUE_NUMBER }}", path: "${{ runner.temp }}/autose/art/review" }
      - name: Route
        working-directory: ${{ env.AUTOSE_TOOL }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_ORCHESTRATOR: ${{ needs.orchestrator.result }}
          RESULT_RELEASE: ${{ needs.release.result }}
          RESULT_REVIEW: ${{ needs.review.result }}
          STATUS_ORCHESTRATOR: ${{ needs.orchestrator.outputs.status }}
          STATUS_RELEASE: ${{ needs.release.outputs.status }}
          STATUS_REVIEW: ${{ needs.review.outputs.status }}
        run: python route.py
      - name: Save updated state bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-issue-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/autose/art
          include-hidden-files: true
          overwrite: true
