# Minimal CI so Gate 5 has something to check (ADR-007). No secrets; read-only token.
name: ci
on:
  push:
    branches: ["autose/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pytest pyyaml && pip install -q -e .
      - run: python -m pytest -q
