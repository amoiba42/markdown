# Minimal CI so Gate 5 has something to check (ADR-007). No secrets; read-only token.
name: ci
on:
  push:
    branches: ["autose/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pytest pyyaml && pip install -q -e .
      # Upstream has one class (tests/test_syntax/extensions/test_md_in_html.py::TestSuite) that pytest refuses to
      # collect; the test package turns that warning into an error, so pytest always exits 1. CI therefore reads the
      # JUnit report and fails on any failure or error except that known one, matching the G4 gate and the baseline.
      - run: python -m pytest -q --continue-on-collection-errors --junitxml=report.xml || true
      - name: Fail on any failure except the known upstream collection error
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          bad = []
          for tc in ET.parse("report.xml").iter("testcase"):
              if tc.find("failure") is not None or tc.find("error") is not None:
                  tid = f"{tc.get('classname')}::{tc.get('name')}"
                  if "test_md_in_html" not in tid:
                      bad.append(tid)
          print("\n".join(bad) or "no failures besides the known upstream collection error")
          sys.exit(1 if bad else 0)
          PY
